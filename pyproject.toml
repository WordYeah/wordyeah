[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordyeah"
version = "0.1.0"
description = "Self-hosted multimodal content moderation and review"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "torch>=2.2",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.9"]
browser = ["playwright>=1.52,<2"]

[project.scripts]
wordyeah-api = "wy_api.__main__:main"
wordyeah-worker = "wy_jobs.__main__:main"
wordyeah-cravatar = "wy_cravatar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wy_api = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
