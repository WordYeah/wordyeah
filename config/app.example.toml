# WordYeah avatar MVP example. No secret or production path belongs here.
app_name = "wordyeah"
version = "0.1.0"
bind = "127.0.0.1"
port = 18765
max_body_bytes = 10485760
max_queue_depth = 1000
api_key_env = "WORDYEAH_API_KEY"
database_path = "./var/wordyeah.sqlite3"
media_root = "./var/media"
media_retention_days = 7
consumer_id = "cravatar-shadow-dev"
policy_profile = "avatar-default"
policy_path = "./config/policy.avatar.example.json"
enforce = false
reviewer_id = "reviewer"
# WORDYEAH_REVIEWER_TOKEN and WORDYEAH_REVIEW_SESSION_SECRET are environment-only secrets.

[worker]
enabled = true
poll_interval_seconds = 1.0
lease_seconds = 120
max_attempts = 3
max_inflight = 1

[model]
id = "Falconsai/nsfw_image_detection"
path = ""
device = "auto"
local_files_only = true

[limits]
max_width = 4096
max_height = 4096
max_pixels = 16777216
max_queue_depth = 1000
per_consumer_concurrency = 1
